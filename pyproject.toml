[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "envistra"
version = "1.0"
description = "Agent-based simulation of enterprise behavioural strategies under green regulatory constraints. Mesa + FastAPI + React."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Oleksii Shevchuk" }]
keywords = [
    "agent-based-modeling",
    "mesa",
    "simulation",
    "computational-economics",
    "environmental-economics",
    "green-transition",
    "emissions-trading",
    "cap-and-trade",
    "behavioural-strategies",
    "scenario-analysis",
]
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Private :: Do Not Upload",
]

# Core simulation stack.
dependencies = [
    "mesa",
    "numpy",
    "pandas",
    "openpyxl",
    "scikit-learn",
    "matplotlib",
    "seaborn",
]

[project.optional-dependencies]
# Web UI backend. pydantic is listed explicitly: it is imported directly by the
# backend, and relying on it arriving transitively through fastapi is fragile.
web = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.1",
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
